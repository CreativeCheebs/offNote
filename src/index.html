<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offnote</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- The editor is a transparent <textarea> layered over a <pre> backdrop
           that mirrors the text and paints #tags. See main.js for the sync. -->
      <div id="editor">
        <pre id="backdrop" aria-hidden="true"><span id="highlights"></span></pre>
        <textarea
          id="note"
          placeholder="Type a note... (Alt+Enter to save, Esc to dismiss)"
          spellcheck="false"
        ></textarea>
      </div>
      <div id="status"></div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
