# QuickNote configuration
# Shortcut syntax: combine Alt / Ctrl / Shift / Win with a key name, e.g. "Alt+Space", "Ctrl+Shift+N".
shortcuts:
  # Global hotkey (works even when the app is not focused) that toggles the quick-note popup.
  toggle_note: "Alt+Space"
  # Hotkey pressed *inside* the note window to save the note and close the popup.
  # Ctrl+Enter and Alt+Enter always work too, regardless of this setting.
  save_note: "Ctrl+Enter"

notes:
  # Folder where daily markdown files are stored, relative to %APPDATA%\QuickNote.
  # Use an absolute path to override.
  directory: "notes"
